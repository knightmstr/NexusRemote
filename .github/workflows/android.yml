name: Android CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Source
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Resolve Version
        id: version
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "VERSION_NAME=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
          else
            echo "VERSION_NAME=1.0.${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Load Signing Key
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/nexusremote-release.keystore"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/nexusremote-release.keystore" >> $GITHUB_ENV
            echo "Signing with the permanent NexusRemote key."
          else
            echo "::warning::SIGNING_KEYSTORE_BASE64 secret not set - APK will use a throwaway debug key."
          fi

      - name: Build Debug APK
        working-directory: ./android
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          gradle clean assembleDebug --stacktrace \
          -PversionCode=${{ github.run_number }} \
          -PversionName=$VERSION_NAME

      - name: Upload Workflow Artifact
        uses: actions/upload-artifact@v6
        with:
          name: NexusRemote-${{ env.VERSION_NAME }}-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: android/app/build/outputs/apk/debug/*.apk
